# Radio 4G eteinte au demarrage.
#
# Ce blacklist empeche le chargement AUTOMATIQUE de iosm par son alias PCI
# au boot : le modem reste hors tension tant que la connexion n'est pas
# demandee. Il ne bloque PAS un "modprobe iosm" explicite, et c'est
# precisement ainsi que xmm7360-connect charge le module a la connexion.
#
# Ne supprimer ce fichier que pour retrouver un modem alimente des le boot.
# Historique : un blacklist identique mais NON accompagne d'un chargement
# explicite est exactement ce qui avait rendu le modem invisible a l'origine.
blacklist iosm
